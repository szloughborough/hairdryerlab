# pnpm 11 项目设置。
#
# ⚠️ 关键：pnpm 10 起，**项目级设置不再从 .npmrc 读取**，必须写在这里。
# （pnpm 自己的警告原文：The "pnpm" field in package.json is no longer read by
#   pnpm. See https://pnpm.io/settings for the new home of each setting.）
#
# ── nodeLinker: hoisted 为什么是必需的 ─────────────────────────────────────
#
# 这曾经是一个**只在干净环境才暴露**的生产问题：
#
#   site/.npmrc 里写了 node-linker=hoisted，但 pnpm 11 完全忽略它
#   → 全新安装得到 isolated（符号链接）布局
#   → 配合 astro.config.mjs 的 vite.resolve.preserveSymlinks: true，
#     Vite 按**真实路径**解析 node_modules/astro，于是在顶层找 html-escaper，
#     而 isolated 布局把它放在 node_modules/.pnpm/node_modules/ 下 → 找不到
#   → 构建中止：Cannot find module 'html-escaper'
#
# 本地一直没暴露，是因为本地 node_modules 是早期用旧版 pnpm 装的（那时
# .npmrc 还生效），布局恰好是 hoisted。CI / Cloudflare 全新安装才会踩到。
#
# 已用「全新克隆 → 安装 → 构建」验证：加上这一行后 45 个页面构建通过。
nodeLinker: hoisted

# esbuild 与 sharp 需要运行安装脚本来准备原生二进制。
# pnpm 10+ 默认拦截依赖的构建脚本，必须显式放行。
allowBuilds:
  esbuild: true
  sharp: true

# 允许 pre/post 脚本（历史上写在 .npmrc 的 enable-pre-post-scripts=true）。
enablePrePostScripts: true

# 关闭运行前的依赖校验。pnpm 11 判定 node_modules「过期」时会尝试删除并重装，
# 无 TTY 环境（CI、脚本）下报 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 直接失败。
# 依赖若真缺失，构建会以模块解析错误明确失败，不会静默通过。
verifyDepsBeforeRun: false
